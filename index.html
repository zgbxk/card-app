<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AI 概念学习卡</title>
<style>
:root{
  --bg:#1a0e07; --card:#2a1a0e; --card2:#241508;
  --l1:#fff5e6; --l2:#fff5e6; --body:#f0e0c8; --aux:#e8c590; --minor:#c4a878;
  --locked:#5a4a3a; --cta:#8cc8ff; --ok:#4ade80; --warn:#f0c060;
  --gold:rgba(245,180,80,0.12); --gold-line:rgba(245,180,80,0.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  color:var(--body);
  background:linear-gradient(168deg,#2e1c0a 0%,#3d2812 12%,#351f0e 25%,#281608 38%,#1e1208 50%,#241608 62%,#2a1a0a 75%,#1a0e07 88%,#221208 100%);
  background-attachment:fixed;
  overflow-x:hidden;
}
/* ── 壁画装饰层（WALL-E 片尾 × 敦煌飞天，纯 CSS） ── */
#mural{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sun{position:absolute;top:-90px;right:-70px;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,rgba(240,192,96,0.34),rgba(240,192,96,0.12) 55%,transparent 70%)}
.mount{position:absolute;bottom:-40px;left:-10%;width:120%;height:150px;opacity:0.5}
.mount::before{content:"";position:absolute;left:0;bottom:0;width:100%;height:150px;
  background:linear-gradient(175deg,transparent 38%,rgba(42,26,10,0.9) 38%,rgba(42,26,10,0.9) 60%,transparent 60%);}
.mount::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:110px;
  background:linear-gradient(170deg,transparent 42%,rgba(26,14,7,0.95) 42%,rgba(26,14,7,0.95) 68%,transparent 68%);}
.ribbon{position:absolute;top:64px;left:-40px;width:220px;height:56px;opacity:0.16;
  background:linear-gradient(115deg,transparent 20%,rgba(245,180,80,0.9) 38%,rgba(232,197,144,0.9) 50%,rgba(245,180,80,0.9) 62%,transparent 80%);
  border-radius:60% 40% 60% 40%/80% 60% 80% 60%;transform:rotate(-8deg)}
.ribbon.r2{top:auto;bottom:110px;left:auto;right:-60px;transform:rotate(10deg) scaleX(-1)}
/* ── 结构 ── */
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 14px 96px;min-height:100%}
header.top{display:flex;align-items:baseline;justify-content:space-between;padding:6px 4px 14px}
.brand{font-size:24px;font-weight:700;color:var(--l1);text-shadow:0 2px 10px rgba(240,192,96,0.35),0 1px 2px #000}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--minor);margin-top:2px}
.stats{font-size:11px;color:var(--minor);text-align:right;line-height:1.6}
/* ── 卡片 ── */
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid rgba(245,180,80,0.16);
  border-radius:18px;padding:16px;margin-bottom:12px;position:relative}
.card.featured{border:1px solid var(--gold-line);box-shadow:0 6px 24px rgba(0,0,0,0.4),0 0 0 1px rgba(245,180,80,0.08) inset}
.flag{position:absolute;top:12px;right:12px;font-size:11px;color:#1a0e07;font-weight:700;
  background:linear-gradient(120deg,#f0c060,#e8c590);border-radius:8px;padding:3px 8px;letter-spacing:1px}
.hook{font-size:17px;font-weight:600;color:var(--l2);text-shadow:0 1px 3px rgba(0,0,0,0.7);line-height:1.45;padding-left:10px;
  border-left:3px solid var(--gold-line);margin-bottom:10px}
.q{font-size:15px;line-height:1.6;color:var(--body);margin:8px 0}
.teaser{font-size:13px;color:var(--aux);font-style:italic;line-height:1.6;margin:8px 0;opacity:0.92}
.teaser::before{content:"部分解析 · ";font-style:normal;color:var(--minor)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid rgba(232,197,144,0.25);color:var(--aux)}
.chip.gold{background:var(--gold);border-color:var(--gold-line);color:var(--l1)}
.chip.green{background:rgba(74,222,128,0.12);border-color:rgba(74,222,128,0.4);color:var(--ok)}
.chip.minor{color:var(--minor);border-color:rgba(196,168,120,0.25)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.meta{font-size:12px;color:var(--minor)}
.meta b{color:var(--aux);font-weight:600}
button{cursor:pointer;border:none;font-family:inherit}
.btn-cta{background:var(--cta);color:#12202a;font-weight:700;font-size:14px;border-radius:12px;padding:10px 18px;
  box-shadow:0 4px 14px rgba(140,200,255,0.25)}
.btn-cta:active{transform:scale(0.97)}
.btn-ok{background:var(--ok);color:#0c2416;font-weight:700;font-size:14px;border-radius:12px;padding:10px 18px;
  box-shadow:0 4px 14px rgba(74,222,128,0.25)}
.done-badge{font-size:12px;font-weight:700;color:var(--ok);border:1px solid rgba(74,222,128,0.45);
  background:rgba(74,222,128,0.1);padding:7px 12px;border-radius:10px}
/* 筛选 */
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f-chip{flex:0 0 auto;font-size:13px;padding:7px 14px;border-radius:99px;background:rgba(42,26,10,0.8);
  color:var(--aux);border:1px solid rgba(232,197,144,0.2)}
.f-chip.on{background:var(--gold);border-color:var(--gold-line);color:var(--l1);font-weight:600}
.sec-title{font-size:15px;font-weight:600;color:var(--aux);margin:16px 4px 10px;letter-spacing:1px}
/* ── 详情页 ── */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--cta);background:none;padding:6px 0;margin-bottom:8px}
h1.name{font-size:26px;font-weight:700;color:var(--l1);text-shadow:0 2px 12px rgba(240,192,96,0.4),0 1px 2px #000;line-height:1.3;margin:6px 0 4px}
.sub{font-size:13px;color:var(--aux);margin-bottom:14px}
.block{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid rgba(245,180,80,0.14);
  border-radius:16px;padding:14px;margin-bottom:12px}
.block h3{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--l2);
  text-shadow:0 1px 2px #000;margin-bottom:10px}
.num{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,rgba(245,180,80,0.3),rgba(245,180,80,0.1));
  border:1px solid var(--gold-line);color:var(--l1);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dessert{background:linear-gradient(120deg,rgba(245,180,80,0.16),rgba(245,180,80,0.05));
  border:1px solid var(--gold-line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:var(--aux)}
.dessert b{color:var(--l1)}
.block.guide{border-color:rgba(140,200,255,0.28);background:linear-gradient(160deg,rgba(53,31,14,0.9),rgba(36,21,8,0.9))}
.block.guide h3{color:var(--cta)}
.block.limit{border-color:rgba(240,192,96,0.32)}
.block.limit h3{color:var(--warn)}
.block.nextstop{border-color:rgba(74,222,128,0.32)}
.block.nextstop h3{color:var(--ok)}
.pathbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px}
.pbtn{font-size:12px;color:var(--cta);background:rgba(42,26,10,0.85);border:1px solid rgba(140,200,255,0.35);border-radius:10px;padding:7px 12px}
.pbtn.off{color:var(--minor);border-color:rgba(196,168,120,0.25);opacity:0.7}
.pathbar .mid{font-size:12px;color:var(--aux);font-weight:600}
.gloss-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gterm{background:rgba(26,14,7,0.5);border:1px solid rgba(232,197,144,0.18);border-radius:10px;padding:9px 10px}
.gterm b{color:var(--l1);font-size:13px}
.gterm span{display:block;font-size:12px;color:var(--body);margin-top:4px;line-height:1.65}
@media (max-width:380px){.gloss-grid{grid-template-columns:1fr}}
.point{display:flex;gap:8px;font-size:14px;line-height:1.7;color:var(--body);margin:6px 0}
.point::before{content:"◆";color:var(--gold-line);font-size:10px;margin-top:6px}
.def{font-size:14px;line-height:1.8;color:var(--body)}
.angle{font-size:13px;line-height:1.8;color:var(--body)}
.angle b{color:var(--aux)}
.rel-tag{font-size:12px;padding:5px 11px;border-radius:99px;background:rgba(140,200,255,0.12);
  border:1px solid rgba(140,200,255,0.4);color:var(--cta)}
.ref{font-size:12px;color:var(--minor);line-height:1.7}
/* 游戏选项 */
.opt{display:block;width:100%;text-align:left;background:rgba(26,14,7,0.55);border:1px solid rgba(232,197,144,0.2);
  border-radius:12px;padding:11px 13px;font-size:14px;color:var(--body);margin:8px 0;line-height:1.5}
.opt:active{transform:scale(0.99)}
.opt.correct{border-color:var(--ok);color:var(--ok);background:rgba(74,222,128,0.1);font-weight:700}
.opt.wrong{border-color:var(--warn);color:var(--warn);background:rgba(240,192,96,0.08)}
.opt:disabled{opacity:0.9}
.judge-row{display:flex;gap:10px;margin:10px 0}
.j-btn{flex:1;font-size:20px;font-weight:700;border-radius:12px;padding:14px 0}
.j-yes{background:rgba(74,222,128,0.16);border:2px solid var(--ok);color:var(--ok)}
.j-no{background:rgba(240,192,96,0.12);border:2px solid var(--warn);color:var(--warn)}
.flip-wrap{perspective:800px;margin:10px auto;width:100%}
.flip{position:relative;width:100%;height:150px;transform-style:preserve-3d;transition:transform .6s}
.flip.open{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:14px;font-size:15px;line-height:1.6}
.flip .front{background:linear-gradient(140deg,#3d2812,#2a1a0a);border:1px solid var(--gold-line);color:var(--aux)}
.flip .back{transform:rotateY(180deg);background:linear-gradient(140deg,#351f0e,#241508);border:1px solid rgba(232,197,144,0.35);color:var(--l1)}
.explain{display:none;background:rgba(26,14,7,0.6);border-left:3px solid var(--gold-line);border-radius:0 12px 12px 0;
  padding:12px;font-size:13px;line-height:1.8;color:var(--body);margin-top:10px}
.explain.show{display:block}
.feedback{font-size:13px;font-weight:700;margin-top:8px}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--warn)}
/* 完成学习 */
.complete-wrap{margin:18px 0 8px}
.btn-complete{width:100%;background:var(--ok);color:#0c2416;font-size:16px;font-weight:700;border-radius:14px;padding:14px;
  box-shadow:0 6px 18px rgba(74,222,128,0.28)}
.btn-complete:disabled{background:#2f3a2f;color:#8aa88f;box-shadow:none}
/* ── 日积月累 ── */
.cheer{background:linear-gradient(130deg,rgba(245,180,80,0.2),rgba(245,180,80,0.04));border:1px solid var(--gold-line);
  border-radius:16px;padding:18px;text-align:center;margin-bottom:12px}
.cheer .t1{font-size:20px;font-weight:700;color:var(--l1);text-shadow:0 2px 10px rgba(240,192,96,0.4);line-height:1.5}
.cheer .t2{font-size:12px;color:var(--aux);margin-top:6px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid rgba(245,180,80,0.14);border-radius:14px;padding:14px 8px;text-align:center}
.stat .v{font-size:22px;font-weight:700;color:var(--l1);text-shadow:0 1px 6px rgba(240,192,96,0.3)}
.stat .k{font-size:11px;color:var(--minor);margin-top:4px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.cal-head .m{font-size:16px;font-weight:600;color:var(--l2)}
.cal-head button{background:rgba(42,26,10,0.8);border:1px solid rgba(232,197,144,0.2);color:var(--aux);border-radius:8px;padding:6px 10px;font-size:13px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-grid .dow{font-size:11px;color:var(--minor);text-align:center;padding:4px 0}
.cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--minor);
  background:rgba(42,26,10,0.35);position:relative}
.cell.learned{background:linear-gradient(140deg,rgba(245,180,80,0.28),rgba(245,180,80,0.08));
  border:1px solid var(--gold-line);font-size:16px}
.cell.learned .dnum{position:absolute;top:2px;right:4px;font-size:9px;color:var(--aux)}
.cell.today{border:1px solid var(--cta)}
.wall{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid rgba(245,180,80,0.16);border-radius:14px;padding:12px}
.badge .e{font-size:28px}
.badge .n{font-size:14px;font-weight:600;color:var(--l2);margin:4px 0 2px}
.badge .d{font-size:11px;color:var(--minor)}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,rgba(245,180,80,0.55),rgba(245,180,80,0.12))}
.t-item{position:relative;margin-bottom:12px}
.t-item::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg,#f0c060,#e8c590);box-shadow:0 0 8px rgba(240,192,96,0.7)}
.t-item .d{font-size:11px;color:var(--minor)}
.t-item .n{font-size:14px;color:var(--body);margin-top:2px}
.empty{font-size:13px;color:var(--minor);text-align:center;padding:22px 0;line-height:1.8}
/* ── TabBar ── */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center}
#tabbar .inner{display:flex;width:100%;max-width:520px;background:linear-gradient(180deg,rgba(36,21,8,0.96),rgba(26,14,7,0.98));
  border-top:1px solid rgba(245,180,80,0.2);backdrop-filter:blur(8px)}
.tab{flex:1;background:none;color:var(--minor);font-size:12px;padding:10px 0 14px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .ic{font-size:20px;filter:grayscale(1) brightness(0.7)}
.tab.on{color:var(--l1);font-weight:600}
.tab.on .ic{filter:none}
/* toast */
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%) translateY(-10px);z-index:20;
  background:linear-gradient(120deg,rgba(61,40,18,0.97),rgba(42,26,10,0.97));border:1px solid var(--gold-line);
  color:var(--l1);font-size:14px;padding:12px 20px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,0.5);
  opacity:0;pointer-events:none;transition:all .3s;text-align:center;max-width:86%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="mural"><div class="sun"></div><div class="ribbon"></div><div class="ribbon r2"></div><div class="mount"></div></div>
<div id="app"></div>
<nav id="tabbar">
  <div class="inner">
    <button class="tab on" data-tab="home"><span class="ic">🧭</span>学习探索</button>
    <button class="tab" data-tab="cal"><span class="ic">🏮</span>日积月累</button>
  </div>
</nav>
<div id="errbar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#7a2a2a;color:#fff5e6;font-size:13px;padding:10px 14px;line-height:1.5"></div>
<div id="toast"></div>
<script>
window.addEventListener('error', function(e){
  var b = document.getElementById('errbar');
  if (b){ b.style.display = 'block'; b.textContent = '页面运行出错：' + (e && e.message ? e.message : '未知错误') + '（请把这句话发给开发者）'; }
});
</script>

atom:{guide:"你和 AI 说话，AI 得先把你的话变成它能判断“对还是错”的小句子。比如“今天下雨”这句话，AI 可以回答对或错；但“请把窗户关上”没有对错之分。这种能判断真假、不能再拆的小句子，就是原子命题——它是 AI 世界里最小的“积木”，后面所有的推理都从它搭起。",

pdf:{guide:"“温度正好是 18.000℃”的概率没有意义，有意义的是“落在 18~20℃ 这个区间里”的概率。概率密度函数就是连续世界里的概率曲线：不看点，看区间；不看高度，看面积。",

harsanyi:{guide:"谈判时你不知道对方的底牌，怎么办？海萨尼说：假设开局有一位“上帝发牌员”，给每人发一张只有自己知道的“类型牌”。你不知道他拿了什么牌，但你知道牌堆里有哪些牌、各有多大几率。于是“完全不知道”变成了“知道所有可能性及其概率”——迷雾游戏变成可以计算的牌局。",
 limit:"转换给了分析框架，但每种类型的概率分布仍要靠经验去估；估错了，后面的计算全部跟着歪。",

lemon:{guide:"二手车买家不知道车的好坏，只肯出一个中间价；好车卖家嫌亏不卖，坏车卖家乐意卖——长期下来，市场上只剩坏车。这就是“劣币驱逐良币”的逆向选择，也叫柠檬市场。",
 limit:"柠檬市场解释了“市场为什么会烂”，但没告诉你：在信息不对等的局面里，你该怎么出牌才不吃亏。",
 next:"不完全信息博弈", nextText:"把“看不清对手”当成常态，研究在这种局面下该怎么下注。"},
"incomplete-game":{guide:"刷到“某股大涨”再买，你接的往往就是先知先觉者的利润。信息差无处不在：直播选品、竞价投放、谈价砍价——凡是对方藏着关键信息，都是不完全信息博弈。",
 limit:"博弈分析告诉你“局势是什么”，可“什么样的结局才算好”还需要一把尺子——只讲策略、不讲“我想要什么”，就做不出选择。",
 next:"最大期望效用 MEU", nextText:"给理性装上“期望效用”这把尺子。"},
meu:{guide:"面对几个选择，把每个结果的“概率 × 价值”加起来，选总分最高的那个——这就是最大期望效用（MEU）。决策论 = 概率论 + 效用理论：概率管“相信什么”，效用管“想要什么”，合起来回答“该做什么”。",
 limit:"MEU 假定你能给每个结果标出“价值（效用）”，可价值是主观的、还会变——标错了数，所谓最优解只是自欺欺人。",
 next:"效用函数", nextText:"把“我想要什么”认真做成一条函数。"},
utility:{guide:"你的第 100 万和第 1 万，快乐完全不是一个量级——钱翻一倍，效用可不会翻一倍。效用函数把“偏好”变成数字：不是钱多就线性地爽，而是越往后越不值钱（边际递减）。",
 limit:"效用是人心里的东西，说不准也测不准；而且人在真实选择里，经常违背自己刚写下的效用函数。",

"risk-aversion":{guide:"“50% 赢 100 万、50% 输 100 万”的公平赌局，期望值是 0，为什么大多数人不玩？因为输 100 万的痛苦远大于赢 100 万的快乐——效用曲线是凹的，这就是风险厌恶。保险的本质，就是花一笔溢价买确定性。",
 limit:"同一个人在不同处境下风险偏好会变：绝境中的人反而会孤注一掷（风险寻求）——一条曲线装不下全部人性。",
 next:"阿莱悖论", nextText:"人的选择甚至能系统性地“违背”期望效用理论。"},
allais:{guide:"稳拿 3000，还是搏 80% 概率拿 4000？按期望算后者更高（3200 > 3000），但多数人选稳拿。人对“确定性”有近乎痴迷的偏爱——阿莱悖论证明：人类是“可预见地非理性”的。",
 limit:"悖论戳穿了“人是期望效用机器”的假设，但它只是描述了偏差，还没教你怎么在偏差里少亏钱。",

"classical-planning":{guide:"搭积木：从“C 压在 A 上”变成“A 压在 B 上、B 压在 C 上”，一步步怎么搬？经典规划就是在“看得全、算得准、世界不动”的理想国里，找出一串能达成目标的动作序列。",
 limit:"理想国太理想：现实里你看不全（信息缺失）、世界会变（不确定）、还有别人掺和（多智能体）。",

"belief-state":{guide:"漆黑房间里找门，你看不见自己在哪，但可以在脑子里维护一张“我可能在哪几个位置”的清单——这张清单就是信念状态。行动和线索不断更新它，直到它收敛成唯一答案。",

conformant:{guide:"闭着眼也要走到门口？办法是：不管初始在哪个位置，都执行“向右移动三次”，保证到达。一致性规划就是这种“无论起点在哪都保证达成目标”的动作序列——约等于给盲人的 SOP。",
 limit:"它完全不看概率，也浪费信息：明明可以边看边走，何必闷着头走到底。",

pomdp:{guide:"迷雾地图上打仗，你永远不知道敌人的真实位置，只能靠模糊的影子不断更新一张“概率热力图”。这张图就是信念状态，策略跟着图走——这就是 POMDP，处理“看不清 + 世界会变”的最强数学模型。",
 limit:"理论很美，计算很贵：状态多起来，精确求解几乎不可行，工程上只能退而求其次做近似。",
 next:"在线重规划", nextText:"放弃“一次性算完美”，改成“边走边改”。"},
replan:{guide:"导航说“已为您重新规划路线”，就是在线重规划：出发前只有个大概计划，边走边看路况，发现封路立刻改道，直到到达。计划不是出发前写死的，而是行动中活出来的。",
 limit:"边走边改也可能被眼前的局部信息带偏：短视的重规划未必全局最优——探索与利用永远在打架。",
 next:"系统1 / 系统2", nextText:"机器会规划了，转过头看人自己：你的大脑是怎么“决策”的。"},
system12:{guide:"2+2 不用想就出答案，那是系统 1（快、自动、省力）；填报销单、窄位停车要全神贯注，那是系统 2（慢、费力、理性）。你每天绝大部分决定，其实都是系统 1 替你做的。",
 limit:"系统 1 快，但爱偷懒、易出错——前面学的贝叶斯、基本率，都是它最容易翻车的地方。",

hindsight:{guide:"结果一出炉，人人都是预言家：“我早就知道会这样。”可事前谁都不知道。后见之明让我们高估自己过去的预测力，把运气当实力、把故事当规律。",
 limit:"看清这个偏差容易，戒掉却难——它深藏在每一个成功故事和失败复盘里。",
 next:"QALY", nextText:"用最后一课把“价值”量化成可以权衡的数字。"},
qaly:{guide:"两年透析（生命质量系数 0.5）和一年完全健康（系数 1），哪个更值？算下来都是 1 个 QALY（质量调整生命年）。QALY 用“年数 × 质量”给生命体验定价，帮医疗把钱花在刀刃上。",

  set(k, v){ memStore[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ /* 本地存储不可用时仅内存保留 */ } }
};

    <div class="q">${c.q}</div>
    <div class="teaser">${c.teaser}</div>
    <div class="tags"><span class="chip gold">${CHAPTERS[c.ch]}</span><span class="chip minor">${c.emoji} ${c.name}</span></div>
    <div class="row">${metaHtml(c)}
      ${isDone ? '<span class="done-badge">✓ 已学习</span>' : '<button class="btn-cta" data-open="'+c.id+'">开始学习</button>'}
    </div>
  </div>`;
}
function renderHome(filter){
  const totalClicks = Object.values(clicks).reduce((a,b)=>a+b,0);
  const totalDone = Object.values(done).reduce((a,b)=>a+b,0);
  const head = `<header class="top">
    <div class="brand">AI 概念学习卡<small>复古未来主义壁画 · 游戏先行</small></div>
    <div class="stats">后台数据<br>点击 ${totalClicks} · 完成 ${totalDone}</div>
  </header>`;
  const top5 = CONCEPTS.slice().sort((a,b)=>b.attract-a.attract).slice(0,5);
  const feat = top5[dayOfYear() % top5.length];
  const list = CONCEPTS.filter(c => !filter || c.ch === filter).sort((a,b)=>b.attract-a.attract);
  const chips = `<div class="filters"><button class="f-chip ${!filter?"on":""}" data-f="">全部</button>` +
    CHAPTERS.map((ch,i)=>`<button class="f-chip ${filter===i?"on":""}" data-f="${i}">${ch}</button>`).join("") + `</div>`;
  app.innerHTML = head + cardHtml(feat, true) + chips +
    `<div class="sec-title">无序探索 · 按吸引力排序</div>` +
    (list.length ? list.map(c=>cardHtml(c,false)).join("") : `<div class="empty">本章节暂无概念</div>`);
}
/* ══════════ 游戏区块（judge / choice / reveal） ══════════ */
function gameHtml(c){
  const solved = (view.solved && view.solved[c.id]);
  let g = "";
  if (c.type === "judge"){
    g = `<div class="q">${c.q}</div>
      <div class="judge-row">
        <button class="j-btn j-yes" data-ans="0" ${solved?"disabled":""}>✓ 对</button>
        <button class="j-btn j-no" data-ans="1" ${solved?"disabled":""}>✗ 错</button>
      </div>`;
  } else if (c.type === "reveal"){
    g = `<div class="flip-wrap"><div class="flip" data-flip>
        <div class="face front">🃏<br>点击翻开题目</div>
        <div class="face back">${c.q}</div>
      </div></div>
      <div class="opts" style="${solved?"":"display:none"}">${optsHtml(c, solved)}</div>`;
  } else {
    g = `<div class="q">${c.q}</div><div class="opts">${optsHtml(c, solved)}</div>`;
  }
  return `<div class="block"><h3><span class="num">01</span>今日挑战</h3>${g}
    <div class="feedback" data-fb></div>
    <div class="explain ${solved?"show":""}" data-exp>${c.explain}</div>
  </div>`;
}
function optsHtml(c, solved){
  return c.opts.map((o,i)=>{
    let cls = "";
    if (solved){
      if (i === c.ans) cls = " correct";
      else if (i === view.picked[c.id]) cls = " wrong";
    }
    return `<button class="opt${cls}" data-pick="${i}" ${solved?"disabled":""}>${o}</button>`;
  }).join("");
}
function answer(c, i){
  view.picked[c.id] = i;
  const ok = (i === c.ans);
  view.solved[c.id] = true;
  const card = app.querySelector(`[data-id="${c.id}"]`);
  const opts = card ? card.querySelectorAll(".opt") : app.querySelectorAll(".opt");
  opts.forEach((o,idx)=>{ o.disabled = true; if (idx === c.ans) o.classList.add("correct"); else if (idx === i) o.classList.add("wrong"); });
  const fb = app.querySelector("[data-fb]"); if (fb){ fb.textContent = ok ? "✓ 回答正确" : "✗ 再想想——看看解析"; fb.className = "feedback " + (ok?"ok":"no"); }
  const ex = app.querySelector("[data-exp]"); if (ex) ex.classList.add("show");
}
/* ══════════ 详情页：概念详情 01-07 ══════════ */
function renderDetail(id){
  const c = BYID[id]; if (!c) { renderHome(); return; }
  const x = EXTRA[c.id] || {guide:"", limit:"", next:"", nextText:""};
  const nextC = x.next ? CONCEPTS.find(k=>k.name===x.next) : null;
  const no = ORDER.indexOf(c.id);
  const prevC = no > 0 ? BYID[ORDER[no-1]] : null;
  const nextInOrder = no >= 0 && no < ORDER.length-1 ? BYID[ORDER[no+1]] : null;
  const gloss = GLOSS[c.id] || [];
  const isDone = !!learned[c.id];
  const rel = c.related.map(r=>{
    const t = CONCEPTS.find(x=>x.name === r);
    return t ? `<button class="rel-tag" data-open="${t.id}">${t.emoji} ${r}</button>` : `<span class="rel-tag">${r}</span>`;
  }).join(" ");
  app.innerHTML = `
    <button class="back" data-back>← 返回学习探索</button>
    <div class="pathbar">
      ${prevC ? `<button class="pbtn" data-open="${prevC.id}">← 上一课</button>` : `<span class="pbtn off">← 起点</span>`}
      <span class="mid">第 ${no+1} / 28 课 · ${CHAPTERS[c.ch]}</span>
      ${nextInOrder ? `<button class="pbtn" data-open="${nextInOrder.id}">下一课 →</button>` : `<span class="pbtn off">终点 →</span>`}
    </div>
    <div class="tags"><span class="chip gold">${CHAPTERS[c.ch]}</span><span class="chip minor">难度 ${"★".repeat(c.diff)}</span><span class="chip minor">热度 ${"🔥".repeat(c.temp)}</span></div>
    <h1 class="name">${c.emoji} ${c.name}</h1>
    <div class="sub">继续阅读，你会学到：${c.hook}</div>
    <div class="block guide"><h3><span class="num">导</span>导读 · 从生活出发</h3>
      <div class="def">${x.guide}</div></div>
    <div data-id="${c.id}">${gameHtml(c)}</div>
    <div class="block"><h3><span class="num">02</span>核心概念</h3>
      <div class="sub" style="margin:0 0 6px">${CHAPTERS[c.ch]} · 难度 ${"★".repeat(c.diff)} · ${c.emoji} ${c.name}</div>
      <div class="def">${c.def}</div></div>
    <div class="dessert"><b>甜点 1 · 哲思谚语</b>　${c.dessert}</div>
    <div class="block"><h3><span class="num">03</span>核心定义</h3><div class="def">${c.def}</div></div>
    <div class="block gloss"><h3><span class="num">词</span>术语拆解（本页黑话变人话）</h3>
      <div class="gloss-grid">${gloss.map(g=>`<div class="gterm"><b>${g.t}</b><span>${g.d}</span></div>`).join("")}</div></div>
    <div class="block"><h3><span class="num">04</span>核心要点</h3>${c.points.map(p=>`<div class="point">${p}</div>`).join("")}</div>
    <div class="dessert"><b>甜点 2</b>　“AI 直觉正在形成”</div>
    <div class="block"><h3><span class="num">05</span>换个角度理解</h3>
      <div class="angle"><b>生活例子：</b>${c.angle.story}</div>
      <div class="angle" style="margin-top:6px"><b>参考书：</b>${c.angle.book}</div></div>
    <div class="block"><h3><span class="num">06</span>关联概念</h3><div class="tags">${rel}</div></div>
    <div class="block"><h3><span class="num">07</span>来源引用</h3><div class="ref">${c.ref}</div></div>
    <div class="block limit"><h3><span class="num">限</span>局限与边界</h3>
      <div class="def">${x.limit}</div></div>
    <div class="block nextstop"><h3><span class="num">N</span>下一站预告</h3>
      <div class="def">${x.nextText}</div>
      ${nextC ? `<button class="btn-cta" style="margin-top:12px" data-open="${nextC.id}">继续学习：${nextC.emoji} ${nextC.name}</button>` : ""}
    </div>
    <div class="complete-wrap">
      <button class="btn-complete" data-complete="${c.id}" ${isDone?"disabled":""}>${isDone ? "✓ 已完成学习" : "完成学习 ✓ · 打卡"}</button>
    </div>`;
  window.scrollTo(0,0);
}
/* ══════════ 日积月累页 ══════════ */
function dates(){ return Object.values(learned).filter(Boolean).sort(); }
function streakInfo(){
  const set = new Set(dates()); if (!set.size) return {cur:0, longest:0};
  let longest = 0, run = 0, prev = null;
  for (const d of set){
    const t = new Date(d + "T00:00:00").getTime();
    if (prev !== null && t - prev === 86400000) run++; else run = 1;
    if (run > longest) longest = run;
    prev = t;
  }
  const today = new Date(); let end = today;
  if (!set.has(todayStr(today))) { end = new Date(today.getTime() - 86400000); if (!set.has(todayStr(end))) return {cur:0, longest}; }
  let cur = 0, t = end;
  while (set.has(todayStr(t))) { cur++; t = new Date(t.getTime() - 86400000); }
  return {cur, longest};
}
function cheer(){
  const ds = dates(); const st = streakInfo(); const today = todayStr();
  let t1, t2;
  if (!ds.length){ t1 = "万里之行，始于足下"; t2 = "今天的第一个游戏正在等你。"; }
  else {
    const last = new Date(ds[ds.length-1] + "T00:00:00").getTime();
    const gap = Math.floor((new Date(today + "T00:00:00").getTime() - last) / 86400000);
    if (st.cur >= 7){ t1 = "连续 " + st.cur + " 天点亮星火"; t2 = "AI 直觉已经生根发芽，继续保持。"; }
    else if (st.cur >= 1 && st.cur <= 3){ t1 = "连续学习第 " + st.cur + " 天"; t2 = "保持节奏，直觉正在形成。"; }
    else if (gap > 7){ t1 = "好久不见"; t2 = "敦煌的星火还在等你点亮，回来吧。"; }
    else if (gap >= 1 && gap <= 3){ t1 = "隔日重逢，正好巩固"; t2 = "温故而知新，来吧。"; }
    else { t1 = "今天也是积累概念的一天"; t2 = "选一个最吸引你的游戏开始。"; }
  }
  return `<div class="cheer"><div class="t1">${t1}</div><div class="t2">${t2}</div></div>`;
}
function renderCalendar(){
  const ds = dates(); const st = streakInfo();
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth();
  const monthCount = ds.filter(d => d.startsWith(y + "-" + String(m+1).padStart(2,"0"))).length;
  const first = new Date(y, m, 1); const daysInMonth = new Date(y, m+1, 0).getDate();
  const startDow = (first.getDay() + 6) % 7; // 周一开头
  let cells = "";
  for (let i = 0; i < startDow; i++) cells += `<div class="cell"></div>`;
  for (let d = 1; d <= daysInMonth; d++){
    const ds2 = y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const rec = Object.entries(learned).find(([,v])=>v===ds2);
    const cls = "cell" + (rec ? " learned" : "") + (ds2 === todayStr() ? " today" : "");
    cells += rec
      ? `<div class="${cls}"><span class="dnum">${d}</span>${BYID[rec[0]] ? BYID[rec[0]].emoji : "✨"}</div>`
      : `<div class="${cls}">${d}</div>`;
  }
  const wall = Object.keys(learned).map(id => {
    const c = BYID[id]; if (!c) return "";
    return `<div class="badge"><div class="e">${c.emoji}</div><div class="n">${c.name}</div>
      <div class="d">${CHAPTERS[c.ch]} · 难度 ${"★".repeat(c.diff)} · 热度 ${"🔥".repeat(c.temp)}</div></div>`;
  }).join("");
  const timeline = ds.map(d => {
    const rec = Object.entries(learned).find(([,v])=>v===d);
    const c = rec && BYID[rec[0]];
    return `<div class="t-item"><div class="d">${d}</div><div class="n">${c ? c.emoji + " " + c.name : "概念"}</div></div>`;
  }).join("");
  app.innerHTML = `
    ${cheer()}
    <div class="stat-grid">
      <div class="stat"><div class="v">${monthCount}</div><div class="k">本月打卡</div></div>
      <div class="stat"><div class="v">${st.cur}</div><div class="k">连续天数</div></div>
      <div class="stat"><div class="v">${st.longest}</div><div class="k">最长连续</div></div>
    </div>
    <div class="cal-head"><span class="m">${y} 年 ${m+1} 月</span><span class="chip gold" style="font-size:11px">敦煌金色徽章</span></div>
    <div class="cal-grid">${["一","二","三","四","五","六","日"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>
    <div class="sec-title">飞天徽章墙</div>
    ${wall ? `<div class="wall">${wall}</div>` : `<div class="empty">还没有点亮任何概念<br>回到学习探索，完成第一个游戏吧</div>`}
    <div class="sec-title">学习脉络</div>
    ${timeline ? `<div class="timeline">${timeline}</div>` : `<div class="empty">时间轴等待你的第一次打卡</div>`}
    <div class="stats" style="text-align:center;padding:16px 0 4px">后台记录：点击 ${Object.values(clicks).reduce((a,b)=>a+b,0)} 次 · 完成学习 ${Object.values(done).reduce((a,b)=>a+b,0)} 次</div>`;
}
/* ══════════ 渲染与事件 ══════════ */
function render(){
  document.querySelectorAll("#tabbar .tab").forEach(t=>{
    t.classList.toggle("on", t.dataset.tab === view.tab);
  });
  if (view.tab === "cal") renderCalendar(); else renderHome(view.filter);
}
function completeLearn(id){
  learned[id] = todayStr();
  done[id] = (done[id] || 0) + 1;
  store.set("acc.learned", learned); store.set("acc.done", done);
  toast("甜点 3 · 恭喜，你又点亮了一颗 AI 星 ✨");
  view.detail = null;
  setTimeout(()=>{ view.tab = "home"; render(); }, 600);
}
app.addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open){ const id = open.dataset.open; clicks[id] = (clicks[id]||0)+1; store.set("acc.clicks", clicks); view.detail = id; renderDetail(id); return; }
  const back = e.target.closest("[data-back]");
  if (back){ view.detail = null; render(); window.scrollTo(0,0); return; }
  const pick = e.target.closest("[data-pick]");
  if (pick){ const c = BYID[view.detail]; if (c && !view.solved[c.id]) answer(c, +pick.dataset.pick); return; }
  const jbtn = e.target.closest(".j-btn");
  if (jbtn){ const c = BYID[view.detail]; if (c && !view.solved[c.id]) answer(c, +jbtn.dataset.ans); return; }
  const flip = e.target.closest("[data-flip]");
  if (flip){ flip.classList.add("open"); const optsBox = flip.parentElement.nextElementSibling; if (optsBox) optsBox.style.display = "block"; return; }
  const complete = e.target.closest("[data-complete]");
  if (complete){ completeLearn(complete.dataset.complete); return; }
  const fchip = e.target.closest("[data-f]");
  if (fchip){ view.filter = (fchip.dataset.f === "") ? null : +fchip.dataset.f; renderHome(view.filter); return; }
});
document.getElementById("tabbar").addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab){ view.tab = tab.dataset.tab; view.detail = null; render(); window.scrollTo(0,0); }
});
/* 启动 */
view.solved = {}; view.picked = {};
render();
var __eb = document.getElementById('errbar'); if (__eb) __eb.style.display = 'none';
</script>
